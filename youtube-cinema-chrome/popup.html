<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div id="main-view">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo">🎬</div>
        <div class="header-text">
          <span class="brand">CinemaMode</span>
          <span class="tagline">YouTube Upgraded</span>
        </div>
      </div>
      <div class="status-pill">ACTIVE</div>
    </div>

    <!-- Feature Toggles -->
    <div class="section-label">FEATURES</div>
    <div class="settings">
      <div class="row">
        <div class="row-left">
          <div class="icon-wrap">🚫</div>
          <div class="row-text">
            <span class="row-title">Ad Blocker</span>
            <span class="row-sub">Skip &amp; hide all ads</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleAdblock" />
          <span class="knob"></span>
        </label>
      </div>

      <div class="row">
        <div class="row-left">
          <div class="icon-wrap">💬</div>
          <div class="row-text">
            <span class="row-title">Hide Comments</span>
            <span class="row-sub">Focus on content only</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleComments" />
          <span class="knob"></span>
        </label>
      </div>

      <div class="row">
        <div class="row-left">
          <div class="icon-wrap">📋</div>
          <div class="row-text">
            <span class="row-title">Hide Sidebar</span>
            <span class="row-sub">No more rabbit holes</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleSidebar" />
          <span class="knob"></span>
        </label>
      </div>

      <div class="row">
        <div class="row-left">
          <div class="icon-wrap">✨</div>
          <div class="row-text">
            <span class="row-title">Glow Progress Bar</span>
            <span class="row-sub">Cinematic progress style</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleProgress" />
          <span class="knob"></span>
        </label>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>YouTube Cinema</span>
      <span class="dot">·</span>
      <span>v1.0</span>
    </div>

  </div><!-- /main-view -->

  <script src="popup.js"></script>
</body>
</html>
